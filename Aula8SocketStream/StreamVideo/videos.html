<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream de Vídeo</title>
</head>
<body>
    <h2>Nosso stream de vídeo</h2>
    <!-- A tag video aponta para a rota /video do nosso servidor Express -->
    <!-- O atributo 'controls' habilita os botões de play, pause e volume -->
    <video src="http://localhost:3000/video" controls="true" width="600"></video>
</body>
</html>
